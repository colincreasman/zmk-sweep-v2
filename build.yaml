# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # ---- Standalone mode: the left half is the central ------------------------
  - board: nice_nano_v2
    shield: cradio_left
  # The right half is a peripheral in BOTH modes, so this one build serves
  # standalone and dongle mode alike.
  - board: nice_nano_v2
    shield: cradio_right
  # The halves and the dongle are all nice!nanos, so this one image resets any
  # of them. Needed when switching between standalone and dongle mode.
  - board: nice_nano_v2
    shield: settings_reset

  # ---- Dongle mode: the PandaKB USB dongle is the central -------------------
  - board: nice_nano_v2
    shield: cradio_dongle pandakb_dongle dongle_display
    artifact-name: cradio_dongle
  # Same left half, rebuilt as a plain peripheral of the dongle.
  - board: nice_nano_v2
    shield: cradio_left
    cmake-args: -DCONFIG_ZMK_SPLIT=y -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
    artifact-name: cradio_left_dongle_mode
